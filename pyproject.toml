[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-interest-rate-models"
version = "0.1.0"
description = "Research on Russian short-rate models and Bank of Russia historical data"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
